tasks.register('cleanReleaseBuckets', Delete) {
    group = 'release'
    delete releaseOutputDir
    delete generatedOutputDir
}

def releaseJarTasks = []

releaseBuckets.each { bucket ->
    def suffix = taskSuffix(bucket.id)
    def metadataDir = layout.buildDirectory.dir("generated/release-buckets/${bucket.id}")
    def metadataTask = tasks.register("generate${suffix}ReleaseMetadata") {
        outputs.dir(metadataDir)
        doLast {
            def dir = metadataDir.get().asFile
            project.delete(dir)
            dir.mkdirs()

            if (bucket.loaders.contains('fabric')) {
                new File(dir, 'fabric.mod.json').setText(fabricMetadata(bucket), 'UTF-8')
            }
            if (bucket.loaders.contains('quilt')) {
                new File(dir, 'quilt.mod.json').setText(quiltMetadata(bucket), 'UTF-8')
            }
            if (bucket.loaders.contains('forge')) {
                def metaInf = new File(dir, 'META-INF')
                metaInf.mkdirs()
                new File(metaInf, 'mods.toml').setText(forgeMetadata(bucket), 'UTF-8')
            }
            if (bucket.loaders.contains('neoforge')) {
                def metaInf = new File(dir, 'META-INF')
                metaInf.mkdirs()
                new File(metaInf, 'neoforge.mods.toml').setText(neoForgeMetadata(bucket), 'UTF-8')
            }
        }
    }

    def sourceJar = layout.projectDirectory.file("versions/${bucket.source}/build/libs/${project.archives_base_name}-${bucket.source}-${project.version}.jar")
    def releaseJar = tasks.register("releaseBucket${suffix}", Jar) {
        group = 'release'
        description = "Builds ${bucket.id} from :${bucket.source} for ${bucket.mcVersions.join(', ')}."
        dependsOn ":${bucket.source}:remapJar"
        dependsOn metadataTask
        destinationDirectory = releaseOutputDir
        archiveFileName = "${project.archives_base_name}-${project.version}-${bucket.id}.jar"
        preserveFileTimestamps = false
        reproducibleFileOrder = true

        doFirst {
            if (!sourceJar.asFile.exists()) {
                throw new GradleException("Expected representative jar missing: ${sourceJar.asFile}")
            }
        }
        from({ zipTree(sourceJar.asFile) }) {
            exclude 'fabric.mod.json'
            exclude 'quilt.mod.json'
            exclude 'META-INF/mods.toml'
            exclude 'META-INF/neoforge.mods.toml'
        }
        from(metadataDir)
    }
    releaseJarTasks.add(releaseJar)
}

tasks.register('buildReleaseBuckets') {
    group = 'release'
    description = 'Builds the reduced Modrinth upload jar set.'
    dependsOn releaseJarTasks
    doLast {
        println "Built ${releaseJarTasks.size()} release bucket jar(s) in ${releaseOutputDir.get().asFile}."
    }
}
