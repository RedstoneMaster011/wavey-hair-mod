import org.gradle.api.tasks.Delete
import org.gradle.jvm.tasks.Jar

apply from: file('versions.gradle')

version = project.mod_version
group = project.maven_group

def releaseOutputDir = layout.buildDirectory.dir('release-buckets')
def generatedOutputDir = layout.buildDirectory.dir('generated/release-buckets')

def taskSuffix = { String id ->
    id.split(/[^A-Za-z0-9]+/)
        .findAll { !it.isBlank() }
        .collect { it.substring(0, 1).toUpperCase() + it.substring(1) }
        .join('')
}

