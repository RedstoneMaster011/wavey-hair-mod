pluginManagement {
    repositories {
        maven { url 'https://maven.architectury.dev/' }
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://maven.minecraftforge.net/' }
        maven { url 'https://maven.neoforged.net/releases/' }
        maven { url 'https://maven.quiltmc.org/repository/release/' }
        gradlePluginPortal()
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.9.5'
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Hair-Physics'

def minecraftVersions = [
    '1.20.1',
    '1.20.2',
    '1.20.3',
    '1.20.4',
    '1.20.5',
    '1.20.6',
    '1.21',
    '1.21.1',
    '1.21.2',
    '1.21.3',
    '1.21.4',
    '1.21.5',
    '1.21.6',
    '1.21.7',
    '1.21.8',
    '1.21.9',
    '1.21.10',
    '1.21.11',
]

def forgeVersions = ['1.20.1', '1.20.2', '1.20.4'] as Set
def neoforgeVersions = minecraftVersions.findAll { mc ->
    !(mc in ['1.20.1', '1.20.2', '1.20.3', '1.20.4'])
} as Set

stonecutter {
    kotlinController = false
    centralScript = 'build.gradle'
    create(getRootProject()) {
        minecraftVersions.each { mc ->
            version "${mc}-fabric", mc
            version "${mc}-quilt", mc
            if (forgeVersions.contains(mc)) {
                version "${mc}-forge", mc
            }
            if (neoforgeVersions.contains(mc)) {
                version "${mc}-neoforge", mc
            }
        }
    }
}

gradle.rootProject {
    apply from: file('release-buckets.gradle')
}
